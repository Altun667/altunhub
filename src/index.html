<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AltunHub</title>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--panel2:#ece8de;--text:#1d1b16;--mut:#7a7466;--gold:#c8901a;--gold2:#f0b429;--line:#ddd7c8;--red:#d64545;--green:#2e9e5b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f13;--panel:#171920;--panel2:#1f222b;--text:#ecebe6;--mut:#8b8f9c;--gold:#f0b429;--gold2:#ffd36b;--line:#2a2d38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f13;--panel:#171920;--panel2:#1f222b;--text:#ecebe6;--mut:#8b8f9c;--gold:#f0b429;--gold2:#ffd36b;--line:#2a2d38;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:20px;color:var(--gold);padding:4px 10px 16px;letter-spacing:.5px}
.nav{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--gold);font-weight:600}
.sp{flex:1}
main{padding:20px 24px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;outline:none}
.search:focus{border-color:var(--gold)}
.btn{background:var(--gold);color:#1a1405;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
.btn.ghost{background:var(--panel2);color:var(--text);font-weight:500}
.banner{background:linear-gradient(90deg,rgba(240,180,41,.18),transparent);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.row{display:flex;align-items:center;gap:10px}
.ico{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:24px}
.nm{font-weight:600;font-size:15px}.x.ed:hover{color:var(--gold)}.ico{cursor:pointer;overflow:hidden}.ico img{width:100%;height:100%;object-fit:cover}
.meta{font-size:12px;color:var(--mut)}
.star{all:unset;cursor:pointer;margin-left:auto;font-size:18px;color:var(--mut)}
.star.on{color:var(--gold2)}
.acts{display:flex;gap:6px;margin-top:4px}
.acts .btn{flex:1;padding:8px}
.x{all:unset;cursor:pointer;color:var(--mut);padding:0 8px;border-radius:8px;background:var(--panel2);display:grid;place-items:center}
.x:hover{color:var(--red)}
.badge{font-size:11px;background:var(--gold);color:#1a1405;border-radius:20px;padding:2px 8px;font-weight:700}
.empty{color:var(--mut);padding:40px;text-align:center;grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);background:var(--panel);border:1px solid var(--gold);padding:10px 18px;border-radius:10px;transition:.25s;opacity:0;font-size:14px;z-index:9}
.toast.show{transform:translateX(-50%);opacity:1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
dialog input,dialog select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px;border-radius:8px;font-size:14px}
@media(max-width:640px){.app{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.logo{padding:6px 10px}.sp{display:none}.nav{white-space:nowrap;gap:6px}main{padding:14px}}
</style>
</head>
<body>
<div class="app">
<aside id="side"></aside>
<main>
  <div class="top">
    <input id="q" class="search" placeholder="Ara…  (Ctrl+K)" autocomplete="off">
    <button class="btn" id="add">+ Ekle</button>
  </div>
  <div id="banner"></div>
  <h2 id="title">Tümü</h2>
  <div class="grid" id="grid"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>
<dialog id="ldlg"><b>Profil linkini ayarla</b>
  <label>Link</label><input id="lu" placeholder="https://youtube.com/@kanalın">
  <div class="acts" style="margin-top:16px"><button class="btn ghost" id="lcancel">Vazgeç</button><button class="btn" id="lsave">Kaydet</button></div></dialog>
<dialog id="dlg">
  <b>Uygulama / Oyun Ekle</b>
  <label>Ad</label><input id="n">
  <label>Yol (.exe veya kısayol)</label><input id="p" placeholder="C:\Program Files\..."><button class="btn ghost" id="browse" type="button" style="display:none;margin-top:6px">Gözat…</button>
  <label>Kategori</label>
  <select id="c"><option>Oyunlar</option><option>Programlar</option><option>Altun</option></select>
  <div class="acts" style="margin-top:16px"><button class="btn ghost" id="cancel">Vazgeç</button><button class="btn" id="save">Kaydet</button></div>
</dialog>
<script>
const KEY="altunhub.apps.v3";
const DEF=[
 {id:1,name:"AltunDP",icon:"🟡",cat:"Altun",ver:"1.2.0",latest:"1.3.0",fav:true,path:"C:\\Altun\\AltunDP.exe"},
 {id:2,name:"AltunCleaner",icon:"🧹",cat:"Altun",ver:"1.0.0",latest:"1.0.0",fav:true,path:"C:\\Altun\\AltunCleaner.exe"},
 {id:7,name:"AltunCore",icon:"🔶",cat:"Altun",ver:"0.1.0",latest:"0.1.0",fav:true,path:"C:\\Altun\\AltunCore.exe"},
 {id:8,name:"YouTube",icon:"▶️",cat:"Sosyal",fav:false,url:"https://youtube.com"},
 {id:9,name:"Instagram",icon:"📸",cat:"Sosyal",fav:false,url:"https://instagram.com"},
 {id:10,name:"TikTok",icon:"🎵",cat:"Sosyal",fav:false,url:"https://tiktok.com"},
 {id:3,name:"Steam",icon:"🎮",cat:"Oyunlar",fav:true,path:"C:\\Steam\\steam.exe"},
 {id:4,name:"Minecraft",icon:"⛏️",cat:"Oyunlar",fav:false,path:"C:\\Games\\Minecraft.exe"},
 {id:5,name:"VS Code",icon:"💻",cat:"Programlar",fav:true,path:"C:\\Code\\Code.exe"},
 {id:6,name:"Chrome",icon:"🌐",cat:"Programlar",fav:false,path:"C:\\Chrome\\chrome.exe"}
];
let apps=DEF,cat="Tümü";
try{const s=localStorage.getItem(KEY);if(s)apps=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(apps))}catch(e){}};
const $=id=>document.getElementById(id);
const cats=["Tümü","Favoriler","Altun","Sosyal","Oyunlar","Programlar"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
const upd=a=>a.latest&&a.latest!==a.ver;
function render(){
  const q=$("q").value.toLowerCase();
  $("side").innerHTML='<div class="logo">⬡ AltunHub</div>'+cats.map(c=>{
    const n=c==="Tümü"?apps.length:c==="Favoriler"?apps.filter(a=>a.fav).length:apps.filter(a=>a.cat===c).length;
    return `<button class="nav ${c===cat?"on":""}" data-c="${c}"><span>${c}</span><span>${n}</span></button>`}).join("")+
    '<div class="sp"></div><button class="nav" id="theme">🌓 Tema</button>';
  const list=apps.filter(a=>(cat==="Tümü"||(cat==="Favoriler"?a.fav:a.cat===cat))&&a.name.toLowerCase().includes(q));
  $("title").textContent=cat;
  const u=apps.filter(upd);
  $("banner").innerHTML=u.length?`<div class="banner">🔔 ${u.length} güncelleme var: ${u.map(a=>esc(a.name)+" "+a.latest).join(", ")}</div>`:"";
  $("grid").innerHTML=list.length?list.map(a=>`<div class="card">
    <div class="row"><div class="ico" data-i="${a.id}" title="İkonu değiştir">${a.icon.startsWith("data:")?'<img src="'+a.icon+'">':a.icon}</div><div><div class="nm">${esc(a.name)}</div><div class="meta">${a.cat==="Sosyal"?(a.url?esc(a.url.replace(/^https?:\/\/(www\.)?/,"").slice(0,28)):"Link ekle"):a.cat+(a.ver?" · v"+a.ver:"")}</div></div>
    <button class="star ${a.fav?"on":""}" data-f="${a.id}">★</button></div>
    ${upd(a)?'<span class="badge" style="align-self:flex-start">Güncelleme '+a.latest+'</span>':""}
    <div class="acts"><button class="btn" data-o="${a.id}">Aç</button>${upd(a)?`<button class="btn ghost" data-u="${a.id}">Güncelle</button>`:""}${a.cat==="Sosyal"?`<button class="btn ghost" data-l="${a.id}">Link</button>`:""}${a.cat!=="Sosyal"?`<button class="x ed" data-e="${a.id}" title="Yolu düzenle">✎</button>`:""}<button class="x" data-d="${a.id}">✕</button></div></div>`).join(""):'<div class="empty">Burada henüz bir şey yok.</div>';
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset,find=i=>apps.find(a=>a.id==i);
  if(d.c){cat=d.c}
  else if(d.f){const a=find(d.f);a.fav=!a.fav;save()}
  else if(d.e){const a=find(d.e);editId=a.id;$("n").value=a.name;$("p").value=a.path||"";$("c").value=a.cat;$("dlg").showModal();return}
  else if(d.l){linkId=d.l;$("lu").value=find(d.l).url||"";$("ldlg").showModal();return}
  else if(d.o){const a=find(d.o);if(a.cat==="Sosyal"){if(a.url){openUrl(a.url)}else{linkId=a.id;$("lu").value="";$("ldlg").showModal();return}}else{if(window.__TAURI__)launch(a);else toast("🚀 "+a.name+" (demo: masaüstü sürümünde gerçek .exe açılır)")}}
  else if(d.u){const a=find(d.u);a.ver=a.latest;save();toast("✅ "+a.name+" "+a.ver+" sürümüne güncellendi")}
  else if(d.d){apps=apps.filter(a=>a.id!=d.d);save()}
  else if(t.id==="theme"){const r=document.documentElement,dark=getComputedStyle(r).colorScheme==="dark";r.dataset.theme=dark?"light":"dark"}
  render();
});
$("q").addEventListener("input",render);
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("q").focus()}});
$("add").onclick=()=>{editId=null;$("n").value=$("p").value="";$("dlg").showModal()};
$("cancel").onclick=()=>$("dlg").close();
let pick=null,linkId=null,editId=null;
function launch(a){window.__TAURI__.core.invoke("launch",{path:a.path||""}).then(()=>toast("🚀 "+a.name+" başlatılıyor…")).catch(e=>toast("⚠️ "+e))}
function openUrl(u){window.__TAURI__?window.__TAURI__.core.invoke("open_url",{url:u}).catch(e=>toast("⚠️ "+e)):window.open(u,"_blank","noopener")}
if(window.__TAURI__){$("browse").style.display="block";$("browse").onclick=async()=>{
  const r=await window.__TAURI__.dialog.open({filters:[{name:"Uygulama",extensions:["exe","lnk","bat","url"]}]});
  if(r){$("p").value=r;if(!$("n").value)$("n").value=r.split(/[\\/]/).pop().replace(/\.[^.]+$/,"")}}}
$("lcancel").onclick=()=>$("ldlg").close();
$("lsave").onclick=()=>{
  let v=$("lu").value.trim();if(v&&!/^https?:\/\//i.test(v))v="https://"+v;
  if(v&&!/^https?:\/\/[^\s]+\.[^\s]+/i.test(v)){toast("⚠️ Geçerli bir link gir");return}
  const a=apps.find(x=>x.id==linkId);if(a){a.url=v;save();render();toast("🔗 "+a.name+" linki kaydedildi")}
  $("ldlg").close();
};
$("grid").addEventListener("click",e=>{const i=e.target.closest(".ico");if(i){pick=i.dataset.i;$("file").click()}});
$("file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f||!pick)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;c.getContext("2d").drawImage(img,0,0,96,96);
    const a=apps.find(x=>x.id==pick);a.icon=c.toDataURL("image/png");save();render();toast("🖼️ "+a.name+" ikonu güncellendi");URL.revokeObjectURL(u)};
  img.src=u;e.target.value="";
});
$("save").onclick=()=>{
  const n=$("n").value.trim();if(!n)return;
  const ic={Oyunlar:"🎮",Programlar:"🧩",Altun:"🟡"}[$("c").value];
  if(editId){const a=apps.find(x=>x.id==editId);a.name=n;a.path=$("p").value;a.cat=$("c").value;editId=null}else apps.push({id:Date.now(),name:n,icon:ic,cat:$("c").value,fav:false,path:$("p").value});
  save();$("n").value=$("p").value="";$("dlg").close();render();toast("➕ "+n+" eklendi");
};
render();
</script>
</body>
</html>
