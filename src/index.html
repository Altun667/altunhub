<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AltunHub</title>
<style>
:root{--bg:#eef3fa;--panel:#fff;--panel2:#e3ebf6;--text:#14213a;--mut:#62708a;--gold:#1f6feb;--gold2:#3b9bff;--line:#d3deee;--red:#d64545;--green:#2e9e5b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d18;--panel:#0f1729;--panel2:#16213a;--text:#e8eefb;--mut:#8493b0;--gold:#2f8cff;--gold2:#5cb2ff;--line:#1f2e4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080d18;--panel:#0f1729;--panel2:#16213a;--text:#e8eefb;--mut:#8493b0;--gold:#2f8cff;--gold2:#5cb2ff;--line:#1f2e4d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:20px;color:var(--gold);padding:4px 10px 16px;letter-spacing:.5px}
.nav{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--gold);font-weight:600}
.sp{flex:1}.logo img{width:28px;height:28px;border-radius:8px;vertical-align:-7px;margin-right:8px}
main{padding:20px 24px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;outline:none}
.search:focus{border-color:var(--gold)}
.btn{background:var(--gold);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}.btn.ghost{background:var(--panel2);color:var(--text);font-weight:500}
.banner{background:linear-gradient(90deg,rgba(47,140,255,.2),transparent);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.row{display:flex;align-items:center;gap:10px}
.ico{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:24px}
.nm{font-weight:600;font-size:15px}.x.ed:hover{color:var(--gold)}.ico{cursor:pointer;overflow:hidden}.ico img{width:100%;height:100%;object-fit:cover}
.meta{font-size:12px;color:var(--mut)}
.star{all:unset;cursor:pointer;margin-left:auto;font-size:18px;color:var(--mut)}
.star.on{color:var(--gold2)}
.acts{display:flex;gap:6px;margin-top:4px}
.acts .btn{flex:1;padding:8px}
.x{all:unset;cursor:pointer;color:var(--mut);padding:0 8px;border-radius:8px;background:var(--panel2);display:grid;place-items:center}
.x:hover{color:var(--red)}
.badge{font-size:11px;background:var(--gold);color:#fff;border-radius:20px;padding:2px 8px;font-weight:700}
.empty{color:var(--mut);padding:40px;text-align:center;grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);background:var(--panel);border:1px solid var(--gold);padding:10px 18px;border-radius:10px;transition:.25s;opacity:0;font-size:14px;z-index:9}
.toast.show{transform:translateX(-50%);opacity:1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
dialog input,dialog select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px;border-radius:8px;font-size:14px}
@media(max-width:640px){.app{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.logo{padding:6px 10px}.sp{display:none}.nav{white-space:nowrap;gap:6px}main{padding:14px}}
</style>
</head>
<body>
<div class="app">
<aside id="side"></aside>
<main>
  <div class="top">
    <input id="q" class="search" placeholder="Ara…  (Ctrl+K)" autocomplete="off">
    <button class="btn" id="add">+ Ekle</button>
  </div>
  <div id="banner"></div>
  <h2 id="title">Tümü</h2>
  <div class="grid" id="grid"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>
<dialog id="dlg">
  <b>Uygulama / Oyun Ekle</b>
  <label>Ad</label><input id="n">
  <label>Yol (.exe veya kısayol)</label><input id="p" placeholder="C:\Program Files\..."><button class="btn ghost" id="browse" type="button" style="display:none;margin-top:6px">Gözat…</button>
  <label>Kategori</label>
  <select id="c"><option>Oyunlar</option><option>Programlar</option></select>
  <div class="acts" style="margin-top:16px"><button class="btn ghost" id="cancel">Vazgeç</button><button class="btn" id="save">Kaydet</button></div>
</dialog>
<script>
const KEY="altunhub.user.v5";
const REMOTE="https://raw.githubusercontent.com/Altun667/altunhub/main/apps.json";
const HUB={id:"hub",name:"AltunHub",repo:"Altun667/altunhub"};
const BUILTIN=[
 {id:"altundp",name:"AltunDP",icon:"icons/altundp.png",cat:"Altun",repo:"Altun667/AltunDp-",exe:"AltunDP.exe",fav:true,cand:["%LOCALAPPDATA%\\Programs\\AltunDP\\AltunDP.exe","%ProgramFiles%\\AltunDP\\AltunDP.exe"]},
 {id:"altunspace",name:"AltunSpace",icon:"icons/altunspace.png",cat:"Altun",repo:"Altun667/AltunSpace",exe:"AltunSpace.exe",fav:true,cand:["%LOCALAPPDATA%\\Programs\\AltunSpace\\AltunSpace.exe","%ProgramFiles%\\AltunSpace\\AltunSpace.exe"]},
 {id:"altuncpu",name:"AltunCPU",icon:"icons/altuncpu.png",cat:"Altun",repo:"Altun667/AltunCpu",exe:"AltunCPU.exe",fav:true,cand:["%LOCALAPPDATA%\\Programs\\AltunCPU\\AltunCPU.exe","%ProgramFiles%\\AltunCPU\\AltunCPU.exe"]},
 {id:"altuncore",name:"AltunCore",icon:"⚙️",cat:"Altun",soon:true},
 {id:"web",name:"Web Sitem",icon:"🌐",cat:"Sosyal",url:"https://altun67.netlify.app/"},
 {id:"yt",name:"YouTube",icon:"▶️",cat:"Sosyal",url:"https://www.youtube.com/@Altun67"},
 {id:"ig",name:"Instagram",icon:"📸",cat:"Sosyal",url:"https://www.instagram.com/altunn_67/"},
 {id:"tt",name:"TikTok",icon:"🎵",cat:"Sosyal",url:"https://www.tiktok.com/@altunn_67"}
];
const $=id=>document.getElementById(id);
const T=()=>window.__TAURI__;
const inv=(c,a)=>T().core.invoke(c,a);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={fav:{},paths:{},icons:{},inst:{},custom:[]};
try{const s=localStorage.getItem(KEY);if(s)S={...S,...JSON.parse(s)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let base=BUILTIN.slice(),F={},LAT={},NOREL={},BUSY={},HUBVER="",cat="Tümü",editId=null,pick=null,REM=[],DISC=[],ICON={};
function mergeRemote(list){if(!Array.isArray(list))return;list.forEach(x=>{if(!x||!x.id)return;const i=base.findIndex(b=>b.id===x.id);if(i>=0)base[i]={...base[i],...x};else base.push(x)})}
try{REM=JSON.parse(localStorage.getItem("altunhub.remote")||"[]")||[]}catch(e){REM=[]}
try{DISC=JSON.parse(localStorage.getItem("altunhub.disc")||"[]")||[]}catch(e){DISC=[]}
try{NOREL=JSON.parse(localStorage.getItem("altunhub.norel")||"{}")||{}}catch(e){NOREL={}}
const ICONMAP={altunlink:"icons/altunlink.png",altunsound:"icons/altunsound.png",altunsounds:"icons/altunsound.png",altuncontroller:"icons/altuncontroller.png",altuncontrol:"icons/altuncontroller.png",altunlauncher:"icons/altunlauncher.png"};
function rebuild(){
  base=BUILTIN.slice();mergeRemote(REM);
  const names=new Set(DISC.map(d=>d.name.toLowerCase()));
  base=base.filter(b=>!(b.soon&&names.has(String(b.name).toLowerCase())));
  const have=new Set(base.map(b=>String(b.repo||"").toLowerCase()));
  DISC.forEach(d=>{
    if(have.has(d.repo.toLowerCase()))return;
    const m=ICONMAP[d.name.toLowerCase()];
    base.push({id:d.id,name:d.name,desc:d.desc,cat:"Altun",repo:d.repo,exe:d.name+".exe",fav:false,disc:!m,
      icon:m||"https://raw.githubusercontent.com/"+d.repo+"/"+d.branch+"/icon.png",
      cand:["%LOCALAPPDATA%\\Programs\\"+d.name+"\\"+d.name+".exe","%ProgramFiles%\\"+d.name+"\\"+d.name+".exe"]});
  });
}
rebuild();
try{const l=localStorage.getItem("altunhub.latest");if(l)LAT=JSON.parse(l)||{}}catch(e){}
const favOf=o=>S.fav[o.id]!==undefined?S.fav[o.id]:!!o.fav;
const all=()=>[
 ...base.map(b=>({...b,fav:favOf(b),icon:S.icons[b.id]||b.icon,path:S.paths[b.id]||"",dl:b.repo?"https://github.com/"+b.repo+"/releases/latest":""})),
 ...S.custom.map(c=>({...c,custom:true,fav:favOf(c),icon:S.icons[c.id]||c.icon}))];
const isExt=a=>!a.custom&&!!a.repo;
const cats=["Tümü","Favoriler","Altun","Sosyal","Oyunlar","Programlar"];
const vnum=t=>(String(t||"").match(/\d+/g)||[]).map(Number);
function newer(a,b){const x=vnum(a),y=vnum(b);for(let i=0;i<Math.max(x.length,y.length);i++){const p=x[i]||0,q=y[i]||0;if(p!==q)return p>q}return false}
const hasUpdate=a=>!!(LAT[a.id]&&F[a.id]&&S.inst[a.id]&&newer(LAT[a.id].tag,S.inst[a.id]));
const hubUpd=()=>!!(LAT.hub&&HUBVER&&newer(LAT.hub.tag,HUBVER));
function pickAsset(as){const ok=(as||[]).filter(x=>/\.(exe|msi|zip)$/i.test(x.name));
 return ok.find(x=>/setup|install|kurulum/i.test(x.name)&&/\.(exe|msi)$/i.test(x.name))||ok.find(x=>/\.exe$/i.test(x.name))||ok.find(x=>/\.msi$/i.test(x.name))||ok[0]||null}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),3200)}
function launch(p,n){inv("launch",{path:p||""}).then(()=>toast("🚀 "+n+" başlatılıyor…")).catch(e=>toast("⚠️ "+e))}
function openUrl(u){T()?inv("open_url",{url:u}).catch(e=>toast("⚠️ "+e)):window.open(u,"_blank","noopener")}
function settle(){let ch=false;for(const a of all().filter(isExt)){if(F[a.id]&&!S.inst[a.id]&&LAT[a.id]){S.inst[a.id]=LAT[a.id].tag;ch=true}}if(ch)save()}
async function refresh(){
  if(T()){for(const a of all().filter(isExt)){
    const m=a.exe?"%LOCALAPPDATA%\\AltunHub\\apps\\"+a.id+"\\"+a.exe:"";
    try{F[a.id]=await inv("find_app",{paths:[a.path,m,...(a.cand||[])].filter(Boolean)})}catch(e){F[a.id]=null}}}
  settle();render();
}
async function fetchLatest(repo){
  const r=await fetch("https://api.github.com/repos/"+repo+"/releases/latest",{headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error(r.status);const j=await r.json();
  return {tag:j.tag_name,url:j.html_url,assets:(j.assets||[]).map(x=>({name:x.name,url:x.browser_download_url}))};
}
async function loadLatest(){
  const items=[...base.filter(b=>b.repo),HUB];
  await Promise.all(items.map(async b=>{try{LAT[b.id]=await fetchLatest(b.repo);delete NOREL[b.id]}catch(e){if(String(e&&e.message)==="404")NOREL[b.id]=true}}));
  try{localStorage.setItem("altunhub.latest",JSON.stringify(LAT));localStorage.setItem("altunhub.norel",JSON.stringify(NOREL))}catch(e){}
  settle();render();
}
async function loadRemote(){try{const r=await fetch(REMOTE+"?t="+Date.now());if(!r.ok)return;const j=await r.json();REM=Array.isArray(j)?j:[];try{localStorage.setItem("altunhub.remote",JSON.stringify(REM))}catch(e){}rebuild()}catch(e){}}
const OWNER="Altun667",TTL=15*60*1000;
const stale=()=>{try{return Date.now()-Number(localStorage.getItem("altunhub.ts")||0)>TTL}catch(e){return true}};
async function discover(){
  const r=await fetch("https://api.github.com/users/"+OWNER+"/repos?per_page=100&sort=updated",{headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error(r.status);
  const j=await r.json();
  DISC=j.filter(x=>x&&!x.fork&&!x.archived&&(x.topics||[]).includes("altunhub")&&x.name.toLowerCase()!==HUB.repo.split("/")[1].toLowerCase())
    .map(x=>({id:"gh-"+x.name.toLowerCase(),name:x.name,repo:x.full_name,desc:x.description||"",branch:x.default_branch||"main"}));
  try{localStorage.setItem("altunhub.disc",JSON.stringify(DISC))}catch(e){}
  rebuild();
}
async function syncAll(force){
  if(!force&&!stale())return true;
  let ok=true;
  try{await discover()}catch(e){ok=false}
  await refresh();await loadLatest();
  if(ok){try{localStorage.setItem("altunhub.ts",String(Date.now()))}catch(e){}}
  return ok;
}
async function install(a){
  const L=LAT[a.id];
  if(!L){openUrl(a.dl);return}
  const as=pickAsset(L.assets);
  if(!as){openUrl(L.url);toast("ℹ️ Bu sürümde indirilebilir dosya yok, sürüm sayfası açıldı");return}
  if(!T()){openUrl(as.url);return}
  BUSY[a.id]=true;render();toast("⬇️ "+a.name+" indiriliyor…");
  try{
    const r=await inv("install_app",{id:a.id,url:as.url,name:as.name,exe:a.exe||""});
    S.inst[a.id]=L.tag;if(r.kind==="portable"&&r.path)S.paths[a.id]=r.path;save();
    toast(r.kind==="installer"?"🛠️ Kurulum başlatıldı, bitince buraya dön":"✅ "+a.name+" "+L.tag+" hazır");
    if(a.id==="hub")setTimeout(()=>inv("exit_app"),1500);
  }catch(e){toast("⚠️ "+e+" (uygulama açıksa kapatıp tekrar dene)")}
  BUSY[a.id]=false;await refresh();
}
function iconHtml(a){
  let ic=String(a.icon);
  if(a.disc&&!ic.startsWith("data:")){const st=ICON[a.id];if(st==="none")return "🧩";if(st==="ico")ic=ic.replace(/icon\.png$/,"icon.ico");return '<img src="'+esc(ic)+'" data-ic="'+esc(a.id)+'">'}
  if(/^(data:image\/|icons\/)/.test(ic))return '<img src="'+esc(ic)+'">';
  return esc(ic);
}
addEventListener("error",e=>{const t=e.target;if(!t||t.tagName!=="IMG"||!t.dataset.ic)return;const id=t.dataset.ic;
  if(ICON[id]!=="ico"){ICON[id]="ico";t.src=t.src.replace(/icon\.png$/,"icon.ico")}else{ICON[id]="none";t.replaceWith(document.createTextNode("🧩"))}},true);
function meta(a){
  if(a.cat==="Sosyal"){try{return esc(new URL(a.url).host.replace(/^www\./,""))}catch(e){return "Sosyal"}}
  if(a.soon)return "Yakında";
  if(isExt(a)){const L=LAT[a.id];
    if(!F[a.id])return L?esc(L.tag)+" · Kurulu değil":(NOREL[a.id]?"Yakında":"Kurulu değil");
    return hasUpdate(a)?esc(S.inst[a.id])+" → "+esc(L.tag):"Kurulu · "+esc(S.inst[a.id]||"")}
  return esc(a.cat);
}
function actions(a){
  const id=esc(a.id),ed=`<button class="x ed" data-e="${id}" title="Yolu düzenle">✎</button>`;
  if(a.cat==="Sosyal")return `<button class="btn" data-o="${id}">Aç</button>`;
  if(a.soon)return `<button class="btn ghost" disabled>Yakında</button>`;
  if(isExt(a)){
    if(!F[a.id]&&NOREL[a.id]&&!LAT[a.id])return `<button class="btn ghost" disabled>Yakında</button>`+ed;
    if(BUSY[a.id])return `<button class="btn" disabled>İndiriliyor…</button>`;
    if(!F[a.id])return `<button class="btn" data-up="${id}">${LAT[a.id]?"İndir":"Sürümler"}</button>`+ed;
    return `<button class="btn" data-o="${id}">Aç</button>`+(hasUpdate(a)?`<button class="btn ghost" data-up="${id}">Güncelle</button>`:"")+ed;
  }
  return `<button class="btn" data-o="${id}">Aç</button>`+ed+`<button class="x" data-d="${id}">✕</button>`;
}
function banner(){
  let h="";
  if(hubUpd())h+=`<div class="banner">🔔 AltunHub'ın yeni sürümü var (${esc(LAT.hub.tag)}) <button class="btn" style="padding:4px 12px;margin-left:8px" data-hub="1">Güncelle</button></div>`;
  const u=all().filter(a=>isExt(a)&&hasUpdate(a));
  if(u.length)h+=`<div class="banner">🔔 Güncelleme var: ${u.map(a=>esc(a.name)+" "+esc(LAT[a.id].tag)).join(", ")}</div>`;
  return h;
}
function render(){
  const q=$("q").value.toLowerCase(),list0=all();
  $("side").innerHTML='<div class="logo"><img src="icons/hub.png" alt="">AltunHub</div>'+cats.map(c=>{
    const n=c==="Tümü"?list0.length:c==="Favoriler"?list0.filter(a=>a.fav).length:list0.filter(a=>a.cat===c).length;
    return `<button class="nav ${c===cat?"on":""}" data-c="${c}"><span>${c}</span><span>${n}</span></button>`}).join("")+
    '<div class="sp"></div><button class="nav" id="reload">🔄 Yenile</button><button class="nav" id="theme">🌓 Tema</button>';
  $("title").textContent=cat;$("banner").innerHTML=banner();
  const list=list0.filter(a=>(cat==="Tümü"||(cat==="Favoriler"?a.fav:a.cat===cat))&&a.name.toLowerCase().includes(q));
  $("grid").innerHTML=list.length?list.map(a=>`<div class="card">
    <div class="row"><div class="ico" data-i="${esc(a.id)}" title="İkonu değiştir">${iconHtml(a)}</div>
    <div><div class="nm" title="${esc(a.desc||"")}">${esc(a.name)}</div><div class="meta">${meta(a)}</div></div>
    <button class="star ${a.fav?"on":""}" data-f="${esc(a.id)}">★</button></div>
    ${isExt(a)&&hasUpdate(a)?'<span class="badge" style="align-self:flex-start">Güncelleme var</span>':""}
    <div class="acts">${actions(a)}</div></div>`).join(""):'<div class="empty">Burada henüz bir şey yok. “+ Ekle” ile oyun veya program ekleyebilirsin.</div>';
}
function act(a){
  if(a.cat==="Sosyal"){openUrl(a.url);return}
  if(isExt(a)){const p=F[a.id];if(p&&T())launch(p,a.name);else openUrl(a.dl);return}
  if(T())launch(a.path,a.name);else toast("🚀 "+a.name+" (demo: masaüstü sürümünde gerçek açılır)");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset,find=i=>all().find(a=>a.id===i);
  if(d.c)cat=d.c;
  else if(d.f){const a=find(d.f);S.fav[d.f]=!a.fav;save()}
  else if(d.o){act(find(d.o));return}
  else if(d.up){install(find(d.up));return}
  else if(d.hub){install({...HUB,dl:"https://github.com/"+HUB.repo+"/releases/latest"});return}
  else if(d.e){const a=find(d.e);editId=a.id;$("n").value=a.name;$("n").disabled=!a.custom;$("p").value=a.path||"";$("c").value=a.custom?a.cat:"Programlar";$("c").disabled=!a.custom;$("dlg").showModal();return}
  else if(d.d){S.custom=S.custom.filter(a=>a.id!==d.d);save()}
  else if(t.id==="reload"){toast("🔄 GitHub'dan yenileniyor…");syncAll(true).then(ok=>toast(ok?"✅ Liste güncellendi":"⚠️ GitHub'a ulaşılamadı, biraz sonra tekrar dene"));return}
  else if(t.id==="theme"){const r=document.documentElement,dark=getComputedStyle(r).colorScheme==="dark";r.dataset.theme=dark?"light":"dark"}
  render();
});
$("q").addEventListener("input",render);
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("q").focus()}});
addEventListener("focus",()=>{if(T())refresh()});
function resetDlg(){editId=null;$("n").value=$("p").value="";$("n").disabled=false;$("c").disabled=false}
$("add").onclick=()=>{resetDlg();$("dlg").showModal()};
$("cancel").onclick=()=>{resetDlg();$("dlg").close()};
$("save").onclick=()=>{
  const n=$("n").value.trim();if(!n)return;const p=$("p").value.trim();
  if(editId){const c=S.custom.find(x=>x.id===editId);if(c){c.name=n;c.path=p;c.cat=$("c").value}else S.paths[editId]=p;toast("💾 Kaydedildi")}
  else{S.custom.push({id:"c"+Date.now(),name:n,icon:{Oyunlar:"🎮",Programlar:"🧩"}[$("c").value]||"🧩",cat:$("c").value,path:p});toast("➕ "+n+" eklendi")}
  save();resetDlg();$("dlg").close();refresh();
};
if(T()){$("browse").style.display="block";$("browse").onclick=async()=>{
  const r=await T().dialog.open({filters:[{name:"Uygulama",extensions:["exe","lnk","bat","url"]}]});
  if(r){$("p").value=r;if(!$("n").value)$("n").value=r.split(/[\\/]/).pop().replace(/\.[^.]+$/,"")}}}
$("grid").addEventListener("click",e=>{const i=e.target.closest(".ico");if(i){pick=i.dataset.i;$("file").click()}});
$("file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f||!pick)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;c.getContext("2d").drawImage(img,0,0,96,96);
    S.icons[pick]=c.toDataURL("image/png");save();render();toast("🖼️ İkon güncellendi");URL.revokeObjectURL(u)};
  img.src=u;e.target.value="";
});
(async()=>{try{if(T()&&T().app)HUBVER=await T().app.getVersion()}catch(e){}render();await refresh();await loadRemote();await syncAll(false);render()})();
</script>
</body>
</html>
